name: Test build (Windows, unsigned)

# Temporary: builds an unsigned NSIS installer of PR #49 for manual testing.
# Lives only on this test branch and is never merged.
on:
  push:
    branches: [claude/project-thread-r470cb]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable

      - run: npm ci
      - run: npm test

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: |
          Set-Content -Path test-build.conf.json -Value '{"bundle":{"createUpdaterArtifacts":false}}' -Encoding ascii
          npm run tauri build -- --bundles nsis --config test-build.conf.json

      - name: Collect installer
        shell: pwsh
        run: |
          $releaseVersion = node -p "require('./package.json').releaseVersion"
          $sha = (git rev-parse --short HEAD).Trim()
          $installers = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -File -Filter "*.exe")
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          New-Item -ItemType Directory -Force -Path test-build | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination "test-build/BaldojnyiDownloader-$releaseVersion-TEST-$sha-Windows-x64-Setup.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-build-windows
          path: test-build/
          if-no-files-found: error
          retention-days: 7
